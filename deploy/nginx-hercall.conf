# Nginx site for HerCall. Replace hercall.example with your domain, then follow DEPLOY.md.
# certbot adds the HTTPS (443) part to this file automatically.

server {
    listen 80;
    listen [::]:80;
    server_name hercall.example www.hercall.example;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
